<body>
    <p> text  is done </p>


    <!-- block element  -->
     <!-- the block element alwaya take the full width of the line that means always start with
      the new line  -->
     <p> this is the paragraph </p>
     <h1>Nishant Singh</h1>

     <!--  inline element -->
    <!-- but the inline element does not take the full width of the line -->
    <p><span> this is <br> test </span></p>
    <img src="image.jpg" alt="Description of image">
    <b>test<i>Hi</i> Hi</b>

    <!-- html quotations -->
       <p> He said <q>Hii Nishant</q></p>
       <p> He said <blockquote> This is a blockquote </blockquote> </p>



    <!-- html colors -->
    <p style="color: red;"> This is red text </p>
    <p style="color: blue;"> This is blue text </p>

    <!-- html images -->
    <img src="image.jpg" alt="Description of image">
    <img src="image.jpg" alt="Description of image" width="200" height="150">


    <!-- html meta tags  -->
     <!-- this use in the inside of the head tag -->
