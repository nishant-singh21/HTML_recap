<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image and multimedia</title>
</head>
<body>
    <!-- image internal and external links -->
    <img src="image.jpg" alt="internal image" height="200" width="300">
    <img src="https://example.com/image.jpg" alt="external image" height="200" width="300">


    <!-- figure and figcaption -->
    <figure>
        <img src="image.jpg" alt="internal image" height="200" width="300">
        <figcaption>Description of the internal image</figcaption>
    </figure>   
     <fieldset>
        <legend>Multimedia Content</legend>
        <video controls width="320" height="240">
            <source src="video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <audio controls>
            <source src="audio.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </fieldset>

    <!--  -->
</body>
</html>
