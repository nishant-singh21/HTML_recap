<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture 4</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }               
    </style>
</head>
<body>
    <!-- Html table  -->
    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>John</td>
            <td>25</td>
        </tr>
        <tr>
            <td>Jane</td>
            <td>30</td>
        </tr>
    </table>

    </body>
<!-- nested table -->       
    <table>
        <tr>
            <th>Name</th>
            <th>Details</th>
        </tr>
        <tr>
            <td>John</td>
            <td>
                <table>
                    <tr>
                        <td>Age: 25</td>
                    </tr>
                    <tr>
                        <td>City: New York</td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td>Jane</td>
            <td>
                <table>
                    <tr>
                        <td>Age: 30</td>
                    </tr>
                    <tr>
                        <td>City: Los Angeles</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

</body>
</html>
